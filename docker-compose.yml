# Production: availability-calendar runs as a NETWORK-ONLY container behind the
# platform's Caddy edge. It publishes NO host ports and joins its own external
# `edge-availability` network (shared only with Caddy), where Caddy reaches it as `availability:8000` and serves it at
# availability.<domain>. (See the platform repo's CONTRACT.md.)
#
#   docker compose up -d --build      # build + start (no host port published)
#
# Local development (publishes localhost:8000, auto-reload on code changes):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Stop with: docker compose down
#
# Its edge network must exist:  docker network create edge-availability
# The SQLite DB lives in the named `availability-data` volume.

services:
  availability:
    build: .
    container_name: availability       # stable name the Caddyfile targets
    environment:
      # The owner key that unlocks all editing. Set it in a .env file next to
      # this one (ADMIN_KEY=...) so it's never baked into the image.
      - ADMIN_KEY=${ADMIN_KEY:-changeme}
    volumes:
      # Persist the SQLite DB (trips, friends, participants) across rebuilds.
      - availability-data:/app/data
    restart: unless-stopped
    networks: [edge]

networks:
  # This app's own edge network, shared with the platform's Caddy and
  # nothing else, so no other container on the box can reach it (security
  # fix plan 5.2). Created out-of-band — CI does it if missing — and Caddy
  # routes availability.<domain> to this container over it.
  edge:
    external: true
    name: edge-availability

volumes:
  availability-data:
    name: availability-data
