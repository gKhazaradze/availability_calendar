name: Deploy (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual triggering from the GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax-check frontend JS
        run: |
          # Fail fast if we've broken the JS before shipping to prod
          node -c frontend/api.js
          node -c frontend/app.js

      - name: Syntax-check Python
        run: python3 -m py_compile backend/app.py

      - name: Backend tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements-dev.txt
          python3 -m pytest backend/ -q

      - name: Validate compose file
        run: |
          # docker-compose.yml has `environment: ADMIN_KEY=${ADMIN_KEY:-changeme}`,
          # which resolves with no .env; just check the base + dev overlay parse.
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Deploy over SSH (the box runs deploy/on-box.sh at this commit)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # This repo's own key signs in as the box's unprivileged `deploy` user,
          # which pins it to one command: deploy this app at the commit sent
          # (my_home_page/deploy/box). No script travels from here — the box
          # runs deploy/on-box.sh as committed on the branch — and the host key
          # is pinned, so a stolen key or a man in the middle gets at most a
          # redeploy of what is already on main (security fix plan 5.4).
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$EC2_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFe7pJ2Ic/SxJmjzozAvmblXVkDJGrokHVRc0yLcMGTD' > ~/.ssh/known_hosts
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "deploy@$EC2_HOST" "$GITHUB_SHA"

      - name: Post-deploy public health check
        run: |
          # availability is served by Caddy at its subdomain over HTTPS.
          # Set repo secret AVAILABILITY_URL = https://availability.<domain>
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 5 "${{ secrets.AVAILABILITY_URL }}/api/health" > /dev/null; then
              echo "Public endpoint healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Public endpoint not responding"
          exit 1
